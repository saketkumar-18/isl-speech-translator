[project]
name = "islspeech"
version = "1.0.0"
description = "ISL Voice: Indian Sign Language to text/speech via hand-pose sequence modeling (GRU + attention over MediaPipe landmarks), fully on-device."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saket Kumar", email = "k.saket@op.iitg.ac.in" }]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "mediapipe",
    "torch",
    "onnx",
    "onnxruntime",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
