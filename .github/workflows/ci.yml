name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy opencv-python-headless scikit-learn pytest onnx onnxruntime
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install mediapipe onnxscript
          pip install -e .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests (features, models, JS parity, ONNX export)
        run: python -m pytest tests/ -q

      - name: Smoke-check web assets
        run: |
          test -f web/index.html
          test -f web/app.js
          test -f web/features.js
          cp web/features.js /tmp/features.mjs
          node --input-type=module -e "import('/tmp/features.mjs').then(m => { if (m.FRAME_FEAT !== 128 || m.SEQ_LEN !== 48) throw new Error('spec mismatch'); console.log('features.js spec OK'); })"
